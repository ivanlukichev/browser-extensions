<rect width="1280" height="800" fill="url(#bgGrad)"/><circle cx="930" cy="300" r="420" fill="#7ce0d0" fill-opacity="0.05"/><text x="96" y="250" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#7ce0d0">BROWSER EXTENSION</text><text x="94" y="320" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#eef5f4">How loud is it,</text><text x="94" y="386" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#eef5f4">really?</text><text x="96" y="436" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#9fb2b3">Measure ambient noise in your browser — one click,</text><text x="96" y="464" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" fill="#9fb2b3">a live decibel estimate from your microphone.</text><circle cx="112" cy="525" r="9" fill="#7ce0d0" fill-opacity="0.16"/><path d="M108 525 l3 3 l5 -6" fill="none" stroke="#7ce0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="530" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#eef5f4">Live dB with min / avg / max</text><circle cx="112" cy="575" r="9" fill="#7ce0d0" fill-opacity="0.16"/><path d="M108 575 l3 3 l5 -6" fill="none" stroke="#7ce0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="580" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#eef5f4">Clear noise zones, color-coded</text><circle cx="112" cy="625" r="9" fill="#7ce0d0" fill-opacity="0.16"/><path d="M108 625 l3 3 l5 -6" fill="none" stroke="#7ce0d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="136" y="630" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#eef5f4">Nothing is recorded or stored</text><text x="96" y="720" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" letter-spacing="1" fill="#9fb2b3">Free  ·  No sign-up  ·  Privacy-first</text><g transform="translate(812,96) scale(1.12)"><rect x="0" y="0" width="340" height="556" rx="22" fill="#0f1518" stroke="#2a373d" stroke-width="1"/><rect x="18" y="18" width="34" height="34" rx="10" fill="#1d282d"/><rect x="26.8" y="36.0" width="2.7" height="8.6" rx="1.4" fill="url(#bar)"/><rect x="32.3" y="30.8" width="2.7" height="13.7" rx="1.4" fill="url(#bar)"/><rect x="37.7" y="25.5" width="2.7" height="19.0" rx="1.4" fill="url(#bar)"/><rect x="43.2" y="33.1" width="2.7" height="11.4" rx="1.4" fill="url(#bar)"/><text x="62" y="30" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.4" fill="#9fb2b3">SOUND METER</text><text x="62" y="47" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#eef5f4">HowLoud</text><rect x="232" y="22" width="90" height="24" rx="12" fill="#f8d28a" fill-opacity="0.16"/><text x="277" y="38" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#f8d28a" text-anchor="middle">Measuring</text><rect x="18" y="64" width="304" height="106" rx="16" fill="#161f23" stroke="#2a373d" stroke-width="1"/><text x="170" y="128" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#eef5f4" text-anchor="middle">62.4<tspan font-size="20" fill="#9fb2b3" dx="6">dB</tspan></text><text x="170" y="152" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#9fb2b3" text-anchor="middle">Current estimate</text><rect x="18" y="188" width="304" height="8" rx="4" fill="#1d282d"/><rect x="18" y="188" width="146" height="8" rx="4" fill="url(#accent)"/><text x="22" y="210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#9fb2b3" text-anchor="start">Very Quiet</text><text x="96" y="210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#9fb2b3" text-anchor="middle">Quiet</text><text x="170" y="210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#9fb2b3" text-anchor="middle">Moderate</text><text x="250" y="210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#9fb2b3" text-anchor="middle">Loud</text><text x="318" y="210" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="8.5" fill="#9fb2b3" text-anchor="end">Very Loud</text><rect x="18" y="226" width="304" height="44" rx="12" fill="#161f23" stroke="#2a373d" stroke-width="1"/><text x="34" y="252" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" letter-spacing="1.2" fill="#9fb2b3">NOISE ZONE</text><text x="306" y="254" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#f8d28a" text-anchor="end">Moderate</text><rect x="18.0" y="286" width="96.0" height="50" rx="12" fill="#161f23" stroke="#2a373d" stroke-width="1"/><text x="66.0" y="306" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1" fill="#9fb2b3" text-anchor="middle">MIN</text><text x="66.0" y="324" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eef5f4" text-anchor="middle">41.2 dB</text><rect x="122.0" y="286" width="96.0" height="50" rx="12" fill="#161f23" stroke="#2a373d" stroke-width="1"/><text x="170.0" y="306" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1" fill="#9fb2b3" text-anchor="middle">AVG</text><text x="170.0" y="324" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eef5f4" text-anchor="middle">55.8 dB</text><rect x="226.0" y="286" width="96.0" height="50" rx="12" fill="#161f23" stroke="#2a373d" stroke-width="1"/><text x="274.0" y="306" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="9" letter-spacing="1" fill="#9fb2b3" text-anchor="middle">MAX</text><text x="274.0" y="324" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eef5f4" text-anchor="middle">73.1 dB</text><text x="170" y="362" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#9fb2b3" text-anchor="middle">The microphone is active — the level updates live.</text><rect x="18" y="378" width="304" height="40" rx="10" fill="url(#primary)"/><text x="170" y="403" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#081012" text-anchor="middle">Stop</text><rect x="18" y="426" width="148" height="38" rx="10" fill="none" stroke="#2a373d"/><text x="92" y="450" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#9fb2b3" text-anchor="middle">Reset</text><rect x="174" y="426" width="148" height="38" rx="10" fill="#1d282d" stroke="#2a373d"/><text x="248" y="450" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eef5f4" text-anchor="middle">Open on web</text><line x1="18" y1="486" x2="322" y2="486" stroke="#2a373d"/><g transform="translate(70,502)"><rect x="0" y="5" width="11" height="8" rx="2" fill="#7ce0d0"/><path d="M2 5 V3 a3.5 3.5 0 0 1 7 0 V5" fill="none" stroke="#7ce0d0" stroke-width="1.6"/></g><text x="89" y="510" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10.5" fill="#9fb2b3">No audio recorded or stored — runs locally</text></g></svg>